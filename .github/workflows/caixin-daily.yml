name: caixin-daily

# 每天 UTC 00:00 运行 = 北京时间 08:00
# 高峰期 GitHub 可能延迟几分钟到十几分钟触发，属正常现象。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:      # 允许在网页上手动点一下立即测试

# 生成网页日报并发布（GitHub Pages）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取财新世界频道、生成日报并推送到手机
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python3 caixin_push.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传网页日报
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
